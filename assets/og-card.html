<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap');
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
.card{width:1200px;height:630px;background:#F5A623;position:relative;
 font-family:'Noto Serif TC',serif;color:#141210;
 display:flex;align-items:center;padding:0 90px;gap:70px}
.frame{position:absolute;inset:26px;border:3px solid #141210;pointer-events:none}
.catwrap{flex:none;width:300px;display:flex;justify-content:center}
.catwrap svg{width:280px;height:auto;color:#141210}
.eye{fill:#93A83A}
.txt{flex:1}
.kick{font-family:ui-monospace,Menlo,monospace;font-size:26px;letter-spacing:.34em;
 text-transform:uppercase;color:#141210;opacity:.72;margin-bottom:20px;font-weight:400}
.title{font-size:150px;font-weight:700;line-height:.92;letter-spacing:.04em}
.tag{margin-top:28px;font-size:30px;line-height:1.5;max-width:640px;font-weight:400}
.tag b{color:#B4231A}
.dot{position:absolute;right:60px;bottom:52px;font-family:ui-monospace,monospace;
 font-size:22px;letter-spacing:.1em;opacity:.7}
</style></head><body>
<div class="card">
 <div class="frame"></div>
 <div class="catwrap">
  <svg viewBox="0 0 120 140">
   <path fill="currentColor" d="M30 44 C31 34 32 30 34 27 L30 6 L47 23 C49 22 51 22 53 22 L61 5 L67 25 C71 31 75 41 79 57 C84 81 85 105 83 123 C82 129 81 130 79 130 L46 130 C44 130 44 128 44 122 L44 98 C43 84 40 70 36 58 C33 50 31 47 30 44 Z"/>
   <path fill="currentColor" d="M74 124 C97 128 109 111 104 95 C101 87 91 88 92 99 C95 109 87 117 73 112 Z"/>
   <ellipse class="eye" cx="38" cy="33" rx="3.2" ry="4.4"/>
  </svg>
 </div>
 <div class="txt">
  <div class="kick">A Cat's-Eye Field Guide to the Strange</div>
  <div class="title">怪奇檔案</div>
  <div class="tag">世界各地<b>真實</b>卻難以置信的事物 —— 由一隻中年黑貓精選、查證、順便吐槽。</div>
 </div>
 <div class="dot">CURIOSA · blackmaoeye.com</div>
</div>
</body></html>
